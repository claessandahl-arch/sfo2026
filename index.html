function build(csv,live){
 const rows=parseCSV(csv);const h=rows.shift().map(x=>x.trim());

 DAYS=[...map].map(([d,pm],i)=>({d,id:'d'+i,passes:[...pm].map(([k,p])=>({...p,key:d+'|'+k}))}));

 render();
}
